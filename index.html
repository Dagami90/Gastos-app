<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>GastosApp</title>
<style>
:root{
 --bg:#07111f;--panel:#0d1b2e;--panel2:#101f34;--line:#203653;
 --text:#f4f7fb;--muted:#8ea2bd;--blue:#3b82f6;--blue2:#60a5fa;
 --green:#31d39b;--red:#ff647c;--gold:#f7c948;--purple:#9b7cff;
 --shadow:0 20px 50px rgba(0,0,0,.28);--radius:18px;
}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 75% -10%,rgba(59,130,246,.16),transparent 60%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(7,17,31,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(32,54,83,.8)}
.topin{max-width:1180px;margin:auto;height:72px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:grid;place-items:center;font-weight:900;box-shadow:0 8px 25px rgba(59,130,246,.3)}
.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.nav{display:flex;gap:6px;overflow:auto}.nav button{background:transparent;color:var(--muted);padding:10px 13px;border-radius:11px;font-weight:700;white-space:nowrap}.nav button.active{background:#12243c;color:#fff;box-shadow:inset 0 0 0 1px #234366}
.actions{display:flex;gap:7px}.iconbtn{width:38px;height:38px;border-radius:11px;background:#0f2035;color:#dce8f7;border:1px solid var(--line)}
main{max-width:1180px;margin:auto;padding:28px 22px 60px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.eyebrow{color:var(--blue2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.title{font-size:30px;letter-spacing:-.04em;margin:5px 0 5px}.subtitle{color:var(--muted)}
.btn{padding:11px 15px;border-radius:12px;background:#12243a;color:#fff;border:1px solid #294563;font-weight:800}.btn.primary{background:linear-gradient(135deg,#2563eb,#4f7df2);border:0;box-shadow:0 10px 25px rgba(37,99,235,.24)}.btn.danger{color:#ff8b9b;background:#2a1720;border-color:#522331}.btn.sm{padding:8px 10px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.kpi,.card{background:linear-gradient(180deg,rgba(16,31,52,.98),rgba(11,25,42,.98));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:18px}.kpi .lab{color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.kpi .num{font-size:25px;font-weight:900;margin-top:8px;letter-spacing:-.03em}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}.card{padding:18px}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.cardhead h3{margin:0;font-size:15px}.muted{color:var(--muted);font-size:11px}
.chart{height:250px;position:relative}.chart canvas{width:100%;height:100%}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px}.legend span{font-size:10px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.list{display:flex;flex-direction:column}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #1a2d47}.row:last-child{border-bottom:0}.left{display:flex;align-items:center;gap:10px;min-width:0}.avatar{width:36px;height:36px;border-radius:11px;background:#162b47;display:grid;place-items:center;font-weight:900;flex:none}.name{font-weight:800}.small{font-size:10px;color:var(--muted);margin-top:3px}.amount{font-weight:900;white-space:nowrap}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #28405e;border-radius:14px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#7890ad;font-size:10px;text-transform:uppercase;padding:11px;border-bottom:1px solid var(--line)}.table td{padding:12px 11px;border-bottom:1px solid #1a2d47;font-size:12px}.table tr:last-child td{border-bottom:0}
.section{margin-top:16px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectiontitle h2{font-size:17px;margin:0}.pill{padding:5px 8px;border-radius:999px;background:#142a45;color:#9fc2ea;font-size:10px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;color:#8ea2bd;font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:6px}.field input,.field select{width:100%;background:#09182a;border:1px solid #28415f;color:#fff;padding:11px 12px;border-radius:11px;outline:0}.field input:focus,.field select:focus{border-color:#4b8cf8;box-shadow:0 0 0 3px rgba(59,130,246,.12)}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.modalback.show{display:flex}.modal{width:min(560px,100%);background:#0c1a2d;border:1px solid #2b4667;border-radius:20px;padding:20px;box-shadow:0 30px 80px #000}.modal h2{margin:0 0 5px}.modal p{color:var(--muted);font-size:12px}.close{float:right;background:#14263d;color:#fff;border-radius:10px;width:32px;height:32px}
.toast{position:fixed;right:18px;bottom:18px;background:#12243b;border:1px solid #315176;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:100}.toast.show{display:block}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.nav{order:3;width:100%}.topin{height:auto;padding:12px 18px;flex-wrap:wrap}.actions{margin-left:auto}}
@media(max-width:600px){main{padding:20px 14px}.hero{display:block}.hero .btn{margin-top:14px}.kpis{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.title{font-size:26px}.topin{gap:8px}}
.syncbadge{font-size:11px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:#aeb8cc;border:1px solid rgba(255,255,255,.08);white-space:nowrap}.syncbadge::before{content:"●";margin-right:6px;font-size:8px}</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topin">
  <div class="brand"><div class="logo">G</div><div><b>GastosApp</b><small>finanzas personales</small></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="actions"><span id="syncBadge" class="syncbadge">Drive</span><button class="iconbtn" onclick="openSettings()" title="Configuración">⚙</button></div>
</div></header>
<main id="main"></main>
</div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='gastosapp_clean_v1';
const DRIVE_URL='https://script.google.com/macros/s/AKfycbw1ouyUTVoD_vZt3IEjm1G9KWDXuEL5WndckPtg6r9WxkwJaq8SGB0r-YZ9_O-kNEHB/exec';
const DRIVE_TOKEN='FY9EcFun0yyhHSgnDNboqZn_';
let syncTimer=null, view='dashboard';

const defaults={
 version:1,
 accounts:[],
 categories:['Casa','Alimentación','Transporte','Salud','Ocio','Formación','Compras','Otros'],
 concepts:[],
 ops:[],
 investments:[],
 settings:{autoSync:true,driveUrl:DRIVE_URL,driveToken:DRIVE_TOKEN}
};
let hadLocalDB=!!localStorage.getItem(KEY);
let db=load();
let driveStatus='';

function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?Object.assign(structuredClone(defaults),x):structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));queueSync();render()}
function hasRealData(x=db){return Array.isArray(x.accounts)&&x.accounts.length>0 || Array.isArray(x.ops)&&x.ops.length>0 || Array.isArray(x.investments)&&x.investments.length>0}
function queueSync(){if(db.settings?.autoSync===false)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncDrive,450)}
async function syncDrive(){
 if(db.settings?.autoSync===false)return;
 const url=db.settings.driveUrl||DRIVE_URL, token=db.settings.driveToken||DRIVE_TOKEN;
 if(!url||!token)return;
 // Never upload an empty database: this protects the Drive copy when opening the app on a new phone.
 if(!hasRealData(db)){driveStatus='empty-not-uploaded';return}
 driveStatus='syncing'; updateSyncBadge();
 try{
   await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:token,data:db,savedAt:new Date().toISOString()})});
   driveStatus='synced'; updateSyncBadge();
 }catch(e){driveStatus='error';updateSyncBadge()}
}
function updateSyncBadge(){
 const b=document.getElementById('syncBadge'); if(!b)return;
 const map={syncing:'Sincronizando…',synced:'Drive sincronizado',restoring:'Recuperando Drive…',restored:'Drive recuperado',error:'Error de Drive', 'empty-not-uploaded':'Sin datos locales'};
 b.textContent=map[driveStatus]||'Drive';
}

async function restoreDriveSilently(force=false){
 const cfg=db.settings||{};
 const url=cfg.driveUrl||DRIVE_URL, token=cfg.driveToken||DRIVE_TOKEN;
 if(!url||!token)return false;
 driveStatus='restoring';updateSyncBadge();

 // Recuperación mediante puente postMessage alojado en Apps Script.
 // Evita CORS/JSONP y funciona aunque GitHub Pages no pueda leer directamente
 // la respuesta de Google. Nunca modifica los datos locales hasta validar la copia.
 return await new Promise(resolve=>{
   let done=false, timer=null, frame=null;
   const finish=(ok)=>{
     if(done)return; done=true;
     window.removeEventListener('message',onMessage);
     if(timer)clearTimeout(timer);
     if(frame)frame.remove();
     if(!ok){driveStatus='error';updateSyncBadge();}
     resolve(ok);
   };
   const onMessage=(ev)=>{
     const d=ev.data;
     if(!d||d.source!=='GastosAppDrive')return;
     if(d.ok===true&&d.data){
       try{finish(applyDriveData(d.data,url,token,force,d.savedAt));}
       catch(e){finish(false)}
     }else finish(false);
   };
   window.addEventListener('message',onMessage);
   frame=document.createElement('iframe');
   frame.style.cssText='position:fixed;width:1px;height:1px;left:-10px;top:-10px;border:0;opacity:0;pointer-events:none';
   frame.setAttribute('aria-hidden','true');
   const origin=location.origin;
   frame.src=url+'?action=bridge&token='+encodeURIComponent(token)+'&origin='+encodeURIComponent(origin)+'&_='+Date.now();
   document.body.appendChild(frame);
   timer=setTimeout(()=>finish(false),20000);
 });
}
function applyDriveData(x,url,token,force,savedAt){
 try{
   if(!Array.isArray(x.accounts)||!Array.isArray(x.ops))return false;
   if(hasRealData(db)&&!force)return false;
   // Normalize old account schema without discarding any records.
   const nx=structuredClone(defaults);
   nx.version=x.version||1;
   nx.accounts=(x.accounts||[]).map(a=>Object.assign({},a,{kind:(a.kind==='normal'||a.kind==='personal')?'personal':'investment'}));
   nx.categories=Array.isArray(x.categories)?x.categories:structuredClone(defaults.categories);
   nx.concepts=Array.isArray(x.concepts)?x.concepts:[];
   nx.ops=Array.isArray(x.ops)?x.ops:[];
   nx.investments=Array.isArray(x.investments)?x.investments:[];
   nx.settings=Object.assign({},structuredClone(defaults.settings),x.settings||{},{driveUrl:url,driveToken:token,autoSync:true});
   db=nx;
   localStorage.setItem(KEY,JSON.stringify(db));
   driveStatus='restored';updateSyncBadge();render();toast('Datos recuperados de Drive'+(savedAt?' · '+new Date(savedAt).toLocaleString('es-ES'):''));
   return true;
 }catch(e){driveStatus='error';updateSyncBadge();return false}
}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function euro(n){return Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function kind(a){return a.kind==='investment'?'investment':'personal'}
function accountsOf(k){return db.accounts.filter(a=>kind(a)===k&&!a.disabled)}
function balance(name){return calcBalance(name)}
function calcBalance(name){
 let v=Number(db.accounts.find(a=>a.name===name)?.initial||0);
 db.ops.forEach(o=>{
   const n=Number(o.amount)||0;
   if(o.type==='Ingreso'&&o.dest===name)v+=n;
   if(o.type==='Gasto'&&o.origin===name)v-=n;
   if(o.type==='Traspaso'){if(o.origin===name)v-=n;if(o.dest===name)v+=n}
   if(o.type==='Inversión'&&o.origin===name)v-=n;
 });
 return v;
}
function investmentTotals(){
 const m={};db.investments.forEach(x=>{const n=x.asset.trim();if(!m[n])m[n]={asset:n,total:0,ops:0};m[n].total+=Number(x.amount)||0;m[n].ops++});return Object.values(m).sort((a,b)=>b.total-a.total)
}
function invCash(){return accountsOf('investment').reduce((s,a)=>s+calcBalance(a.name),0)}
function monthOps(){const ym=new Date().toISOString().slice(0,7);return db.ops.filter(o=>String(o.date||'').slice(0,7)===ym)}
function totalWealth(){return db.accounts.filter(a=>!a.disabled).reduce((s,a)=>s+calcBalance(a.name),0)}
function openModal(content){document.getElementById('modal').innerHTML=content;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function nav(){document.getElementById('nav').innerHTML=[['dashboard','Dashboard'],['movimientos','Movimientos'],['cuentas','👤 Cuentas personales'],['inversiones','📈 Inversiones']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(v){view=v;render()}

function render(){
 nav();
 const main=document.getElementById('main');
 if(view==='dashboard')return dashboard(main);
 if(view==='movimientos')return movimientos(main);
 if(view==='cuentas')return cuentas(main);
 if(view==='inversiones')return inversiones(main);
}
function dashboard(el){
 const mo=monthOps(),inc=mo.filter(o=>o.type==='Ingreso').reduce((s,o)=>s+o.amount,0),exp=mo.filter(o=>o.type==='Gasto').reduce((s,o)=>s+o.amount,0),inv=mo.filter(o=>o.type==='Inversión').reduce((s,o)=>s+o.amount,0);
 const acc=db.accounts.filter(a=>!a.disabled), wealth=acc.reduce((s,a)=>s+calcBalance(a.name),0);
 el.innerHTML=`<div class="hero"><div><div class="eyebrow">Septiembre 2026 · resumen</div><div class="title">Tu dinero, de un vistazo.</div><div class="subtitle">Cuentas, movimientos e inversiones en un solo panel.</div></div></div>
 <div class="kpis">
  <div class="kpi"><div class="lab">Patrimonio total</div><div class="num">${euro(wealth)}</div></div>
  <div class="kpi"><div class="lab">Ingresos del mes</div><div class="num green">${euro(inc)}</div></div>
  <div class="kpi"><div class="lab">Gastos del mes</div><div class="num red">${euro(exp)}</div></div>
  <div class="kpi"><div class="lab">Invertido este mes</div><div class="num gold">${euro(inv)}</div></div>
 </div>
 <div class="grid2">
  <div class="card"><div class="cardhead"><h3>Patrimonio por cuenta</h3><span class="muted">${acc.length} cuentas</span></div><div class="chart"><canvas id="dashChart"></canvas></div><div class="legend">${acc.map((a,i)=>`<span><i class="dot" style="background:${palette(i)}"></i>${esc(a.name)}</span>`).join('')}</div></div>
  <div class="card"><div class="cardhead"><h3>Cuentas</h3><span class="muted">todas</span></div><div class="list">${acc.map((a,i)=>`<div class="row"><div class="left"><div class="avatar">${kind(a)==='investment'?'↗':'€'}</div><div><div class="name">${esc(a.name)}</div><div class="small">${kind(a)==='investment'?'Cuenta de inversión':'Cuenta personal'}</div></div></div><div class="amount">${euro(calcBalance(a.name))}</div></div>`).join('')||'<div class="empty">Añade tu primera cuenta desde Cuentas personales.</div>'}</div></div>
 </div>
 <div class="grid2 section">
  <div class="card"><div class="cardhead"><h3>Últimos movimientos</h3><button class="btn sm" onclick="go('movimientos')">Ver todos</button></div><div class="list">${db.ops.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(o=>`<div class="row"><div><div class="name">${esc(o.desc||o.asset||o.type)}</div><div class="small">${o.date} · ${esc(o.origin||o.dest||'')}</div></div><div class="amount ${o.type==='Ingreso'?'green':o.type==='Gasto'?'red':'gold'}">${o.type==='Ingreso'?'+':'-'}${euro(o.amount)}</div></div>`).join('')||'<div class="empty">Sin movimientos.</div>'}</div></div>
  <div class="card"><div class="cardhead"><h3>Inversiones</h3><span class="muted">capital</span></div><div class="list">${investmentTotals().slice(0,6).map(a=>`<div class="row"><div class="left"><div class="avatar">↗</div><div><div class="name">${esc(a.asset)}</div><div class="small">${a.ops} operación${a.ops===1?'':'es'}</div></div></div><div class="amount gold">${euro(a.total)}</div></div>`).join('')||'<div class="empty">Sin inversiones.</div>'}</div></div>
 </div>`;
 setTimeout(()=>drawAccountChart(acc),0);
}
function palette(i){return ['#3b82f6','#9b7cff','#31d39b','#f7c948','#ff647c','#60a5fa','#c084fc','#34d399'][i%8]}
function drawAccountChart(acc){
 const c=document.getElementById('dashChart');if(!c)return;const dpr=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const w=r.width,h=r.height;
 x.clearRect(0,0,w,h);const vals=acc.map(a=>calcBalance(a.name)),max=Math.max(1,...vals),min=Math.min(0,...vals);for(let i=0;i<4;i++){const y=18+i*(h-40)/3;x.strokeStyle='#1b304b';x.lineWidth=1;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}
 const bw=Math.min(70,(w-30)/Math.max(1,acc.length)-12);vals.forEach((v,i)=>{const bh=(v-min)/(max-min||1)*(h-45),x0=18+i*((w-25)/Math.max(1,vals.length));x.fillStyle=palette(i);x.beginPath();x.roundRect(x0,h-20-bh,bw,bh,8);x.fill()})
}
function movimientos(el){
 el.innerHTML=`<div class="hero"><div><div class="eyebrow">Registro</div><div class="title">Movimientos</div><div class="subtitle">Todo lo que entra, sale o se mueve entre cuentas.</div></div><button class="btn primary" onclick="newMovement()">＋ Nuevo movimiento</button></div>
 <div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th>Cuenta</th><th>Importe</th><th></th></tr></thead><tbody>${db.ops.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<tr><td>${o.date}</td><td>${esc(o.type)}</td><td>${esc(o.desc||o.asset||'')}</td><td>${esc(o.origin||o.dest||'')}</td><td class="${o.type==='Ingreso'?'green':o.type==='Gasto'?'red':'gold'}">${euro(o.amount)}</td><td><button class="btn sm danger" onclick="deleteOp('${o.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No hay movimientos.</div></td></tr>'}</tbody></table></div></div>`;
}
function newMovement(){
 const acc=db.accounts.filter(a=>!a.disabled);
 openModal(`<button class="close" onclick="closeModal()">×</button><h2>Nuevo movimiento</h2><p>Registra un ingreso, gasto o traspaso.</p>
 <div class="formgrid">
 <div class="field"><label>Tipo</label><select id="mType" onchange="movementFields()"><option>Gasto</option><option>Ingreso</option><option>Traspaso</option></select></div>
 <div class="field"><label>Fecha</label><input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Descripción</label><input id="mDesc" placeholder="Ej. Supermercado"></div>
 <div class="field"><label>Importe</label><input id="mAmount" type="number" step="0.01" min="0" placeholder="0,00"></div>
 <div class="field"><label>Cuenta origen</label><select id="mOrigin">${acc.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Cuenta destino</label><select id="mDest">${acc.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select></div>
 </div><div class="formactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveMovement()">Guardar</button></div>`);
 movementFields()
}
function movementFields(){const t=document.getElementById('mType');if(!t)return;document.getElementById('mOrigin').parentElement.style.display=t.value==='Ingreso'?'none':'block';document.getElementById('mDest').parentElement.style.display=t.value==='Gasto'?'none':'block'}
function saveMovement(){
 const type=mType.value, amount=Number(mAmount.value);if(!amount||amount<=0)return alert('Indica un importe válido.');
 db.ops.push({id:id(),date:mDate.value,type,desc:mDesc.value.trim(),amount,origin:mOrigin.value,dest:mDest.value});closeModal();save();toast('Movimiento guardado')
}
function deleteOp(i){if(!confirm('¿Eliminar este movimiento?'))return;db.ops=db.ops.filter(x=>x.id!==i);save();toast('Movimiento eliminado')}
function cuentas(el){
 const pers=accountsOf('personal'), inv=accountsOf('investment');
 el.innerHTML=`<div class="hero"><div><div class="eyebrow">Patrimonio</div><div class="title">Cuentas</div><div class="subtitle">Las cuentas personales y las de inversión están separadas, pero el Dashboard las muestra todas.</div></div><button class="btn primary" onclick="newAccount()">＋ Nueva cuenta</button></div>
 <div class="grid2"><div class="card"><div class="cardhead"><h3>Cuentas personales</h3><span class="pill">${pers.length}</span></div><div class="list">${pers.map(accountRow).join('')||'<div class="empty">No hay cuentas personales.</div>'}</div></div>
 <div class="card"><div class="cardhead"><h3>Cuentas de inversión</h3><span class="pill">${inv.length}</span></div><div class="list">${inv.map(accountRow).join('')||'<div class="empty">No hay cuentas de inversión.</div>'}</div></div></div>`;
}
function accountRow(a){return `<div class="row"><div class="left"><div class="avatar">${kind(a)==='investment'?'↗':'€'}</div><div><div class="name">${esc(a.name)}</div><div class="small">${kind(a)==='investment'?'Cuenta de inversión':'Cuenta personal'} · saldo inicial ${euro(a.initial)}</div></div></div><div style="display:flex;align-items:center;gap:8px"><div class="amount">${euro(calcBalance(a.name))}</div><button class="btn sm" onclick="editAccount('${a.id}')">Editar</button><button class="btn sm danger" onclick="deleteAccount('${a.id}')">×</button></div></div>`}
function newAccount(){accountForm()}
function editAccount(i){const a=db.accounts.find(x=>x.id===i);if(a)accountForm(a)}
function accountForm(a){
 openModal(`<button class="close" onclick="closeModal()">×</button><h2>${a?'Editar cuenta':'Nueva cuenta'}</h2><p>El tipo de cuenta se puede cambiar cuando quieras.</p><div class="formgrid"><div class="field"><label>Nombre</label><input id="aName" value="${esc(a?.name||'')}"></div><div class="field"><label>Tipo</label><select id="aKind"><option value="personal" ${kind(a||{})==='personal'?'selected':''}>Cuenta personal</option><option value="investment" ${kind(a||{})==='investment'?'selected':''}>Cuenta de inversión</option></select></div><div class="field"><label>Saldo inicial</label><input id="aInitial" type="number" step="0.01" value="${a?.initial||0}"></div></div><div class="formactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAccount('${a?.id||''}')">Guardar</button></div>`)
}
function saveAccount(i){
 const name=aName.value.trim(), initial=Number(aInitial.value)||0,k=aKind.value;if(!name)return alert('Escribe un nombre.');
 if(db.accounts.some(a=>a.name.toLowerCase()===name.toLowerCase()&&a.id!==i))return alert('Ya existe una cuenta con ese nombre.');
 if(i){const a=db.accounts.find(x=>x.id===i);a.name=name;a.kind=k;a.initial=initial}
 else db.accounts.push({id:id(),name,kind:k,initial,disabled:false});
 closeModal();save();toast('Cuenta guardada')
}
function deleteAccount(i){const a=db.accounts.find(x=>x.id===i);if(!a)return;const used=db.ops.some(o=>o.origin===a.name||o.dest===a.name);if(used)return alert('Esta cuenta tiene movimientos. Puedes editarla o dejarla desactivada, pero no se puede borrar mientras tenga movimientos.');if(!confirm('¿Eliminar la cuenta '+a.name+'?'))return;db.accounts=db.accounts.filter(x=>x.id!==i);save();toast('Cuenta eliminada')}

function inversiones(el){
 const assets=investmentTotals(),total=assets.reduce((s,a)=>s+a.total,0),cash=invCash();
 el.innerHTML=`<div class="hero"><div><div class="eyebrow">Cartera</div><div class="title">Inversiones</div><div class="subtitle">Una cartera limpia: solo cuánto dinero has invertido en cada activo.</div></div><button class="btn primary" onclick="newInvestment()">＋ Añadir inversión</button></div>
 <div class="kpis"><div class="kpi"><div class="lab">Total invertido</div><div class="num gold">${euro(total)}</div></div><div class="kpi"><div class="lab">Activos</div><div class="num">${assets.length}</div></div><div class="kpi"><div class="lab">Operaciones</div><div class="num">${db.investments.length}</div></div><div class="kpi"><div class="lab">Efectivo inversión</div><div class="num">${euro(cash)}</div></div></div>
 <div class="card"><div class="cardhead"><h3>Mis activos</h3><span class="muted">capital acumulado</span></div><div class="list">${assets.map((a,i)=>`<div class="row"><div class="left"><div class="avatar" style="background:${palette(i)}22;color:${palette(i)}">↗</div><div><div class="name">${esc(a.asset)}</div><div class="small">${a.ops} operación${a.ops===1?'':'es'}</div></div></div><div style="display:flex;align-items:center;gap:8px"><div class="amount gold">${euro(a.total)}</div><button class="btn sm" onclick="addToAsset('${esc(a.asset)}')">＋ Añadir €</button><button class="btn sm danger" onclick="deleteAsset('${esc(a.asset)}')">×</button></div></div>`).join('')||'<div class="empty">Todavía no tienes activos.</div>'}</div></div>
 <div class="card section"><div class="cardhead"><h3>Últimas inversiones</h3><span class="muted">solo importe</span></div><div class="list">${db.investments.slice().reverse().slice(0,10).map(x=>`<div class="row"><div><div class="name">${esc(x.asset)}</div><div class="small">${x.date} · ${esc(x.account)}</div></div><div class="amount gold">${euro(x.amount)}</div></div>`).join('')||'<div class="empty">No hay inversiones registradas.</div>'}</div></div>`
}
function newInvestment(){investmentForm()}
function addToAsset(asset){investmentForm({asset})}
function investmentForm(x={}){
 const inv=accountsOf('investment');
 if(!inv.length)return alert('Crea primero una cuenta de inversión en Cuentas.');
 openModal(`<button class="close" onclick="closeModal()">×</button><h2>${x.asset?'Añadir a '+esc(x.asset):'Nueva inversión'}</h2><p>Solo guardamos el dinero invertido. Más adelante podremos añadir cantidad, precio y valor de mercado.</p><div class="formgrid"><div class="field"><label>Activo</label><input id="iAsset" value="${esc(x.asset||'')}" placeholder="S&P 500, Ethereum, BTC..."></div><div class="field"><label>Cuenta</label><select id="iAccount">${inv.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Euros invertidos</label><input id="iAmount" type="number" min="0" step="0.01" placeholder="0,00"></div><div class="field"><label>Fecha</label><input id="iDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="formactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveInvestment()">Guardar inversión</button></div>`)
}
function saveInvestment(){const asset=iAsset.value.trim(),amount=Number(iAmount.value);if(!asset)return alert('Escribe el activo.');if(!amount||amount<=0)return alert('Indica los euros invertidos.');db.investments.push({id:id(),asset,account:iAccount.value,date:iDate.value,amount});db.ops.push({id:id(),date:iDate.value,type:'Inversión',desc:asset,asset,amount,origin:iAccount.value,dest:''});closeModal();save();toast('Inversión añadida')}
function deleteAsset(asset){const count=db.investments.filter(x=>x.asset===asset).length;if(!confirm('¿Eliminar '+asset+' y sus '+count+' inversiones registradas?'))return;db.investments=db.investments.filter(x=>x.asset!==asset);db.ops=db.ops.filter(o=>!(o.type==='Inversión'&&o.asset===asset));save();toast('Activo eliminado')}

function openSettings(){
 openModal(`<button class="close" onclick="closeModal()">×</button><h2>Configuración</h2>
 <p><span class="syncdot"></span>Sincronización automática con Google Drive</p>
 <div class="field"><label>URL de sincronización</label><input id="driveUrl" value="${esc(db.settings.driveUrl||DRIVE_URL)}"></div>
 <div class="field" style="margin-top:10px"><label>Clave</label><input id="driveToken" value="${esc(db.settings.driveToken||DRIVE_TOKEN)}"></div>
 <div class="field" style="margin-top:12px"><label><input id="auto" type="checkbox" ${db.settings.autoSync!==false?'checked':''}> Sincronizar automáticamente después de cada cambio</label></div>
 <div class="formactions"><button class="btn" onclick="restoreDrive()">☁ Recuperar de Drive</button><button class="btn" onclick="exportData()">Exportar copia</button><button class="btn" onclick="importData()">Importar copia</button><button class="btn primary" onclick="saveSettings()">Guardar</button></div>`)
}

function saveSettings(){
 db.settings.autoSync=document.getElementById('auto').checked;
 db.settings.driveUrl=document.getElementById('driveUrl').value.trim()||DRIVE_URL;
 db.settings.driveToken=document.getElementById('driveToken').value.trim()||DRIVE_TOKEN;
 localStorage.setItem(KEY,JSON.stringify(db));
 closeModal();
 if(db.settings.autoSync)syncDrive();
 toast('Sincronización automática activada');
}
function restoreDrive(){
 restoreDriveSilently(true).then(ok=>{if(!ok)alert('No se pudo recuperar la copia de Drive. Comprueba la conexión y que la copia de Drive exista.')});
}

function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='GastosApp_copia.json';a.click()}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.accounts||!x.ops)return alert('Copia no válida.');db=Object.assign(structuredClone(defaults),x);localStorage.setItem(KEY,JSON.stringify(db));closeModal();render();toast('Copia restaurada')}catch(e){alert('No se pudo leer la copia.')}};r.readAsText(f)};i.click()}

(async function boot(){
 render();
 updateSyncBadge();
 // A new device may have no local data. Try Drive, but NEVER overwrite Drive with an empty local database if recovery fails.
 if(!hadLocalDB && !hasRealData(db)){
   const ok=await restoreDriveSilently(false);
   if(!ok){driveStatus='error';updateSyncBadge();}
 }
})();
</script>
</body></html>
